name: Flutter Build
on:
  repository_dispatch:
    types: [flutter_build, web2apk]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        run: |
          curl -L "$ZIP_URL" -o project.zip
          unzip -q project.zip -d project
        env:
          ZIP_URL: ${{ secrets.ZIP_URL }}
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        working-directory: project
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: project/build/app/outputs/flutter-apk/*.apk
