name: Flutter Build
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [flutter_build, web2apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        env:
          ZIP_URL: ${{ secrets.ZIP_URL }}
        run: |
          curl -L "$ZIP_URL" -o project.zip || true
          rm -rf project
          mkdir -p project
          if [ -s project.zip ]; then unzip -q project.zip -d project; fi
          if [ ! -f project/pubspec.yaml ]; then
            inner=$(find project -maxdepth 3 -name pubspec.yaml | head -1)
            if [ -n "$inner" ]; then
              d=$(dirname "$inner")
              if [ "$d" != "project" ]; then cp -r "$d"/. project/; fi
            fi
          fi
          ls -la project
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch Gradle
        working-directory: project
        run: |
          if [ -f android/gradle.properties ]; then
            grep -q "android.newDsl" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
            grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=35,36" >> android/gradle.properties
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' android/settings.gradle
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' android/build.gradle || true
          fi
      - name: Build APK
        working-directory: project
        run: |
          flutter pub get
          MODE="${{ github.event.client_payload.mode }}"
          if [ -z "$MODE" ]; then MODE=release; fi
          flutter build apk --$MODE
      - uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: project/build/app/outputs/flutter-apk/*.apk
